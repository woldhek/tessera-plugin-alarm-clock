# Alarm clock: two alarms on the glass, each with a time, its days and an on/off key, set on the screen itself. When one
# goes off the screen shows a popup with Snooze and Stop, rings on its own speaker when it has one, and can start a
# sound on a media player of Home Assistant. Every alarm is an entity of the screen too, so Home Assistant can read and
# set it. Every name, label and hint below is a key into translations/<language>.json, part "app".
id: alarm_clock
version: 0.1.1
# 0.18: the popup. Nothing newer is used, so it builds on Tessera's release and on its dev branch.
api: "0.18"
icon: alarm
maintainer: woldhek
license: MIT
stage: beta
topics: [time, home]
attributes: [ai-developed]
requires:
  esphome: 2026.9.0
boards: any
flash_kb: 28

permissions:
  # Only when a media player was chosen for the screen: the alarm starts a sound there and stops it again.
  home_assistant_actions: [media_player.play_media, media_player.media_stop, media_player.volume_set]

# Optional: the media player of Home Assistant that plays a sound when an alarm goes off (a speaker in the same room).
# Leave it empty for none. It is built into the screen: another choice builds the screen again.
inputs:
  - { id: media_player, kind: entity, domains: [media_player], scope: screen, label: input_player, hint: input_player_hint }

tiles:
  # The next alarm: its time and its day. A tap opens the card that sets both alarms.
  - id: alarm
    name: tile_name
    icon: alarm
    sizes: { min: 1x1, max: 2x2 }
    memory: 500
    example: tile_example

cards:
  - { id: alarm, name: card_name }

# The alarm's own sound, on a screen with a speaker (from its board or another plugin): on by default.
parts:
  - { id: sound, file: parts/sound.yaml, label: part_sound, hint: part_sound_hint, features: [speaker], flash_kb: 36, default: true }

# The settings of plugin.yaml, also on the screen's own settings page (each entity's name written as an id).
settings:
  - { key: alarm_snooze, label: setting_snooze, hint: setting_snooze_hint }
  - { key: alarm_snooze_minutes, label: setting_snooze_minutes }
  - { key: alarm_ring_minutes, label: setting_ring_minutes, hint: setting_ring_minutes_hint }
  # Only on a screen with a speaker (the part sound): elsewhere the editor shows it unavailable.
  - { key: alarm_sound, label: setting_sound, hint: setting_sound_hint }
  - { key: alarm_media, label: setting_media, hint: setting_media_hint }
  - { key: alarm_media_volume, label: setting_media_volume, hint: setting_media_volume_hint }
  - { key: ring_alarm, label: setting_test, hint: setting_test_hint }
